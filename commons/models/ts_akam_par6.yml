task_name:
  code: ts
  desc: Two-Step Task
  cite:
  - Daw, N. D., Gershman, S. J., Seymour, B., Ben Seymour, Dayan, P., & Dolan, R.
      J. (2011). Model-Based Influences on Humans' Choices and Striatal Prediction Errors.
      Neuron, 69(6), 1204-1215. https://doi.org/10.1016/j.neuron.2011.02.027
model_name:
  code: akam_par6
  desc: Hybrid Model for reduced task
  cite:
    - Akam, T., Costa, R., & Dayan, P. (2015).
      Simple Plans or Sophisticated Habits? State, Transition and Learning Interactions in the Two-Step Task.
      PLoS Comput Biol, 11(12):e1004648. https://doi.org/10.1371/journal.pcbi.1004648

model_type:
  code:
  desc: Hierarchical
notes:
contributors:
  - name: Franziska Knolle/Maryia
    email: franziskaknolle@gmail.com
    link: 
data_columns:
  subjID: A unique identifier for each subject in the data-set.
  level1_choice: "Choice made for Level (Stage) 1 (1: stimulus 1, 2: stimulus 2)."
  level2_choice:
    "Choice made for Level (Stage) 2 (1: stimulus 3, 2: stimulus 4).\n        Note that, in our notation, choosing stimulus
    1 in Level 1 leads to stimulus 3 in Level 2 with a common (0.7 by default)
    transition. Similarly, choosing stimulus 2 in Level 1 leads to stimulus 4
    in Level 2 with a common (0.7 by default) transition. To change this default transition
    probability, set the function argument `trans_prob` to your preferred value."
  reward: Reward after Level 2 (0 or 1).
parameters:
  a1:
    desc: learning rate in stage 1
    info: [0, 0.5, 1]
  beta1:
    desc: inverse temperature in stage 1
    info: [0, 1, Inf]
  a2:
    desc: learning rate in stage 2
    info: [0, 0.5, 1]
  beta2:
    desc: inverse temperature in stage 2
    info: [0, 1, Inf]
  pi:
    desc: perseverance (unsigned, if signed, so positive and negative/stay and switch, put to -5, 0, 5)
    info: [0, 1, 5]
  w:
    desc: model-based weight
    info: [0, 0.5, 1]
regressors:
  mf_RPE: 2
  mb_RPE: 2
  mfb_RPE: 2
postpreds:
  - y_pred_step1
  - y_pred_step2
additional_args:
  - code: trans_prob
    default: 0.7
    desc:
      Common state transition probability from Stage (Level) 1 to Stage (Level)
      2. Defaults to 0.7.
